[package]
name = "bevy-lab04-camera"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

# Проект самостоятельный: Cargo не ищет общий проект в родительских папках.
[workspace]

[dependencies]
# Только необходимые подсистемы: 3D, приложение и окно, без звука и геймпадов.
bevy = { version = "0.19", default-features = false, features = [
    "3d_bevy_render", "default_app", "std", "bevy_winit", "multi_threaded", "x11",
] }

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 3
